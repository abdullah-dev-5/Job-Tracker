{{ applications_json|json_script:"applications-data" }}

<div class="modal-backdrop is-hidden" data-add-modal aria-hidden="true">
  <form action="{% url 'application:app_modals' %}" class="modal modal-form" method="post" enctype="multipart/form-data" data-application-form>
    {% csrf_token %}
    <div class="modal-heading">
      <div>
        <h2 data-form-title>Add an application</h2>
        <p>Capture the essentials now. You can add notes later.</p>
      </div><button class="modal-close" type="button" aria-label="Close" data-close-modal><svg class="icon icon-xs">
          <use href="#icon-close"></use>
        </svg></button>
    </div>
    <input type="hidden" name="application_id" data-form-id>
    <div class="form-grid">
      <label>Logo colour<select name="logo_style" data-form-logo-style>
          <option value="accent">Accent</option>
          <option value="plum">Plum</option>
          <option value="coral">Coral</option>
          <option value="ink">Ink</option>
          <option value="blue">Blue</option>
        </select></label>
      <label>Company<input name="company" placeholder="e.g. Figma" required data-form-company>
        <span class="logo-preview" data-logo-preview aria-live="polite">
          <span class="company-mark mark-accent" data-logo-preview-fallback></span>
          <img class="company-logo is-hidden" data-logo-preview-image alt="">
          <span class="logo-preview-status" data-logo-preview-status>Logo lookup will happen automatically.</span>
        </span>
      </label>
      <label>Upload logo <span class="optional-label">(optional)</span><input type="file" name="logo_image" accept="image/gif,image/jpeg,image/png,image/webp" data-form-logo-image></label>
      <input type="hidden" name="logo_url" data-form-logo-url>
      <label>Job title<input name="role" placeholder="e.g. Product Designer" required data-form-role></label>
      <div class="form-two"><label>Status<select name="status" data-form-status>
            <option>Applied</option>
            <option>Phone Screen</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Rejected</option>
          </select></label><label>Date applied<input type="date" name="applied_date" required
            data-form-date></label></div>
    </div>
    
    <div class="modal-actions"><button class="button button-delete" type="submit" name="action" value="delete" data-form-delete style="display:none;">Delete</button><button class="button button-muted" type="button" data-close-modal>Cancel</button><button
      class="button button-accent" type="submit" name="action" value="save" data-form-submit>Save application</button>
    </div>
  </form>
</div>

<div class="modal-backdrop is-hidden" data-detail-modal aria-hidden="true">
  <div class="modal detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="modal-heading">
      <div class="detail-heading"><span class="company-mark" data-detail-mark><span data-detail-logo-fallback></span><img class="company-logo is-hidden" data-detail-logo alt=""></span>
        <div>
          <h2 id="detail-title" data-detail-company></h2>
          <p data-detail-role></p>
        </div>
      </div><button class="modal-close" type="button" aria-label="Close" data-close-modal><svg class="icon icon-xs">
          <use href="#icon-close"></use>
        </svg></button>
    </div>
    <div class="detail-grid">
      <div><span>Status</span><strong data-detail-status></strong></div>
      <div><span>Date applied</span><strong data-detail-date></strong></div>
    </div>
    <button class="button button-accent button-full" type="button" data-detail-edit><svg class="icon icon-xs">
        <use href="#icon-edit"></use>
      </svg>Edit application</button>
  </div>
</div>
